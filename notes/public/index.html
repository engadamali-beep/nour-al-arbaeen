<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ملاحظاتي | تطبيق ملاحظاتك الشخصية</title>
<meta name="description" content="ملاحظاتي — مساحة شخصية لملاحظاتك. بياناتك محلية وخاصة بك.">
<meta name="theme-color" content="#0d6b52">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f4; --card:#ffffff; --ink:#18211c; --muted:#68776f;
  --line:#e2e8e3; --brand:#0d6b52; --brand-2:#094c39; --brand-soft:#e0f2e9;
  --gold:#c9a227; --danger:#cf4444;
  --shadow:0 14px 34px rgba(18,45,36,.12);
  --radius:20px;
}
[data-theme="dark"]{
  --bg:#0f1311; --card:#171d1a; --ink:#edf2ee; --muted:#98a69d;
  --line:#2a332e; --brand:#37a97f; --brand-2:#2a8a66; --brand-soft:#1e3229;
  --shadow:0 14px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Tajawal","Segoe UI",Tahoma,"Noto Kufi Arabic","Cairo",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased;}
[hidden]{display:none !important;}
h1,h2,h3,h4,p{margin:0;}
button{font-family:inherit;}
input,textarea{font-family:inherit;}
::placeholder{color:var(--muted);}
.spacer{flex:1}

/* ---------- أزرار ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;border-radius:12px;cursor:pointer;font-size:.95rem;font-weight:600;transition:all .2s ease;box-shadow:0 4px 14px rgba(18,45,36,.06);}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border:0;color:#fff;box-shadow:0 8px 20px rgba(13,107,82,.30);}
.btn-primary:hover{filter:brightness(1.07);}
.btn-danger{background:#fdecec;color:#c0392b;border-color:#f3d2d2;}
.btn-block{width:100%;}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px;}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:1rem;transition:all .2s ease;}
.icon-btn:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);}

/* ---------- شاشة التسجيل / الدخول ---------- */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 520px at 8% -10%,#dcefe5 0%,transparent 60%),radial-gradient(820px 520px at 108% 112%,#f2e8cd 0%,transparent 55%),var(--bg);}
.auth-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px 30px 28px;box-shadow:var(--shadow);}
.auth-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 14px;box-shadow:0 10px 24px rgba(13,107,82,.35);}
.auth-title{text-align:center;font-size:1.7rem;font-weight:800;margin:0 0 6px;}
.auth-sub{text-align:center;color:var(--muted);font-size:.92rem;margin:0 0 20px;}
.auth-tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;}
.auth-tab{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:9px;cursor:pointer;font-weight:700;font-size:.92rem;transition:all .2s ease;}
.auth-tab.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(13,107,82,.3);}
.auth-form{display:flex;flex-direction:column;gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:.88rem;font-weight:700;}
.field input[type="text"],.field input[type="email"],.field input[type="password"]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem;outline:0;transition:border-color .2s ease, box-shadow .2s ease;}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.input-affix{position:relative;}
.input-affix input{padding-inline-end:46px;}
.input-affix .affix-btn{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:1.05rem;color:var(--muted);width:34px;height:34px;border-radius:8px;}
.auth-error{background:#fdecec;border:1px solid #f3d2d2;color:#c0392b;border-radius:12px;padding:10px 14px;font-size:.9rem;text-align:center;}
.auth-note{margin:2px 0 0;text-align:center;color:var(--muted);font-size:.8rem;}
.btn-block{width:100%;padding:12px;}

/* ---------- شاشة التطبيق ---------- */
.app-screen{min-height:100vh;}
.app-header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.ah-inner{max-width:1120px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap;}
.ah-brand{display:flex;align-items:center;gap:10px;margin-inline-end:6px;}
.ah-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 6px 14px rgba(13,107,82,.30);}
.ah-name{font-weight:800;font-size:1.2rem;}
.ah-search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;}
.ah-search input{flex:1;border:0;background:transparent;outline:0;color:var(--ink);font-size:1rem;}
.ah-user{position:relative;}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0;font-weight:700;font-size:16px;cursor:pointer;display:grid;place-items:center;transition:transform .2s ease;}
.avatar:hover{transform:scale(1.05);}
.avatar-lg{width:46px;height:46px;font-size:20px;border-radius:14px;border-radius:50%;}
.user-menu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;width:250px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;z-index:60;}
.user-menu-head{display:flex;gap:10px;align-items:center;padding:6px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:8px;}
.user-name{font-weight:700;}
.user-email{color:var(--muted);font-size:.82rem;word-break:break-all;}
.user-menu-item{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:10px;cursor:pointer;font-size:.92rem;font-weight:600;text-align:start;}
.user-menu-item:hover{background:var(--brand-soft);color:var(--brand);}

.app-main{max-width:1120px;margin:0 auto;padding:18px 16px 60px;}
.page-title{font-size:1.35rem;font-weight:800;margin:0;}
.app-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 16px;flex-wrap:wrap;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.9rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(18,45,36,.05);}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(13,107,82,.28);}
.chip-count{background:rgba(127,127,127,.18);border-radius:999px;padding:1px 8px;font-size:.8rem;font-weight:800;}
.chip.active .chip-count{background:rgba(255,255,255,.25);}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding-bottom:10px;}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 6px 18px rgba(18,45,36,.06);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .2s ease;min-height:150px;}
.ncard:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.ncard[data-color="amber"]{background:#fff7e6;border-color:#f0e0b0;}
.ncard[data-color="sky"]{background:#e8f3fb;border-color:#c4e0f0;}
.ncard[data-color="rose"]{background:#fdecef;border-color:#f5d3d9;}
.ncard[data-color="violet"]{background:#f2edfb;border-color:#e3d7f6;}
.ncard[data-color="mint"]{background:#e9f8f1;border-color:#c8ecd9;}
[data-theme="dark"] .ncard[data-color="amber"]{background:#2b2413;border-color:#4a3f22;}
[data-theme="dark"] .ncard[data-color="sky"]{background:#14222c;border-color:#234055;}
[data-theme="dark"] .ncard[data-color="rose"]{background:#2c161b;border-color:#4c2530;}
[data-theme="dark"] .ncard[data-color="violet"]{background:#221b33;border-color:#3d2f5c;}
[data-theme="dark"] .ncard[data-color="mint"]{background:#12281f;border-color:#1f4536;}
.ncard-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ncard-dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.10);}
.ncard-pin{color:var(--gold);font-weight:700;font-size:.85rem;display:inline-flex;gap:4px;align-items:center;}
.ncard-title{margin:0;font-size:1.05rem;font-weight:700;line-height:1.5;color:inherit;}
.ncard[data-color="amber"] .ncard-title{color:#8a5a00;}
.ncard[data-color="sky"] .ncard-title{color:#0b5b8c;}
.ncard[data-color="rose"] .ncard-title{color:#a32438;}
.ncard[data-color="violet"] .ncard-title{color:#5b3fb8;}
.ncard[data-color="mint"] .ncard-title{color:#0d7a52;}
.ncard-content{margin:0;color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;}
.ncard-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px dashed var(--line);}
.ncard-date{color:var(--muted);font-size:.78rem;}
.ncard-actions{display:flex;gap:6px;}
.ncard-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.9rem;display:grid;place-items:center;transition:all .15s ease;padding:0;}
.ncard-btn:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);}
.ncard-btn.danger{color:var(--danger);}
.ncard-btn.danger:hover{background:#fdecec;border-color:var(--danger);}

.empty{text-align:center;padding:60px 20px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);}
.empty-icon{font-size:2.6rem;margin-bottom:10px;}
.empty h3{color:var(--ink);margin-bottom:6px;}

/* ---------- المحرر ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(8,20,15,.55);backdrop-filter:blur(4px);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:22px;overflow:auto;}
.modal-backdrop.open{background:rgba(8,20,15,.45);}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px;width:min(680px,100%);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(14px);opacity:0;transition:all .25s ease;}
.modal-backdrop.open .modal{transform:none;opacity:1;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.modal-title{margin:0;font-size:1.15rem;font-weight:800;}
.editor-title{width:100%;border:0;background:transparent;outline:0;color:var(--ink);font-size:1.6rem;font-weight:700;padding:6px 0;border-bottom:2px solid var(--line);transition:border-color .2s ease;}
.editor-title:focus{border-bottom-color:var(--brand);}
.editor-content{width:100%;min-height:190px;border:0;background:transparent;outline:0;resize:vertical;color:var(--ink);font-size:1.05rem;line-height:2;padding:10px 0;}
.editor-content::placeholder{color:var(--muted);}
.editor-flags{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;}
.check{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600;cursor:pointer;}
.editor-meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.84rem;margin:8px 0;}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .15s ease;}
.swatch:hover{transform:scale(1.08);}
.swatch[data-color="amber"]{background:#fff7e6;border-color:#f0e0b0;}
.swatch[data-color="sky"]{background:#e8f3fb;border-color:#c4e0f0;}
.swatch[data-color="rose"]{background:#fdecef;border-color:#f5d3d9;}
.swatch[data-color="violet"]{background:#f2edfb;border-color:#e3d7f6;}
.swatch[data-color="mint"]{background:#e9f8f1;border-color:#c8ecd9;}
.swatch[data-color="default"]{background:var(--card);border:2px solid var(--line);}
.swatch.active{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.modal-actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.modal-actions .spacer{flex:1;}

/* ---------- الإشعارات ---------- */
.toast{position:fixed;bottom:26px;inset-inline-start:50%;transform:translateX(-50%) translateY(24px);background:#16211b;color:#fff;padding:12px 22px;border-radius:999px;opacity:0;transition:all .3s ease;z-index:130;box-shadow:0 14px 34px rgba(0,0,0,.35);font-weight:600;font-size:.92rem;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- عام ---------- */
@media (max-width:640px){
  .ah-inner{gap:10px;}
  .ah-name{font-size:1.05rem;}
  .page-title{font-size:1.15rem;}
  .modal-backdrop{padding:12px;}
}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول / إنشاء الحساب -->
<section class="auth-screen" id="authScreen" hidden>
  <div class="auth-card">
    <div class="auth-logo">م</div>
    <h1 class="auth-title">ملاحظاتي</h1>
    <p class="auth-sub">مساحة آمنة لكل ما تُفكر به — بياناتك محلية وخاصة بك.</p>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-mode="login">تسجيل الدخول</button>
      <button type="button" class="auth-tab" data-mode="register">إنشاء حساب</button>
    </div>
    <form class="auth-form" id="authForm" novalidate>
      <div class="field" id="nameField">
        <label for="authName">الاسم (اختياري)</label>
        <input type="text" id="authName" placeholder="الاسم الكامل أو اللقب" autocomplete="name">
      </div>
      <div class="field">
        <label for="authEmail">البريد الإلكتروني</label>
        <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="authPassword">كلمة المرور</label>
        <div class="input-affix">
          <input type="password" id="authPassword" placeholder="••••••••" autocomplete="new-password" required>
          <button type="button" class="affix-btn" id="authEye" aria-label="إظهار كلمة المرور">👁</button>
        </div>
      </div>
      <div class="auth-error" id="authError" hidden></div>
      <button type="submit" class="btn btn-primary btn-block" id="authSubmit">تسجيل الدخول</button>
      <p class="auth-note">بياناتك تُحفظ في قاعدة بيانات محلية على الخادم وتُستخدم فقط لحسابك.</p>
    </form>
  </div>
</section>

<!-- شاشة التطبيق -->
<section class="app-screen" id="appScreen" hidden>
  <header class="app-header">
    <div class="ah-inner">
      <div class="ah-brand">
        <span class="ah-logo">م</span>
        <span class="ah-name">ملاحظاتي</span>
      </div>
      <div class="ah-search">
        <span>🔍</span>
        <input id="searchInput" type="search" placeholder="ابحث في ملاحظاتك...">
      </div>
      <button class="icon-btn" id="themeToggle" title="تبديل الوضع">🌙</button>
      <div class="ah-user">
        <button class="avatar" id="userAvatar" title="الملف الشخصي">أ</button>
        <div class="user-menu" id="userMenu" hidden>
          <div class="user-menu-head">
            <div class="avatar avatar-lg" id="userAvatarLg">أ</div>
            <div>
              <div class="user-name" id="userName"></div>
              <div class="user-email" id="userEmail"></div>
            </div>
          </div>
          <button class="user-menu-item" id="logoutBtn">🚪 تسجيل الخروج</button>
        </div>
      </div>
    </div>
  </header>
  <main class="app-main">
    <div class="chips" id="chips">
      <button class="chip active" data-filter="all">📝 كل الملاحظات <span class="chip-count" id="countAll">0</span></button>
      <button class="chip" data-filter="pinned">📌 المثبتة <span class="chip-count" id="countPinned">0</span></button>
      <button class="chip" data-filter="archived">🗃 المؤرشفة <span class="chip-count" id="countArchived">0</span></button>
    </div>
    <div class="app-actions">
      <h2 class="page-title" id="pageTitle">ملاحظاتي</h2>
      <button class="btn btn-primary" id="newNoteBtn">＋ أضف ملاحظة جديدة</button>
    </div>
    <div id="notesGrid" class="notes-grid"></div>
    <div class="empty" id="emptyState" hidden>
      <div class="empty-icon">📝</div>
      <h3 id="emptyTitle">لا توجد ملاحظات بعد</h3>
      <p id="emptyText">ابدأ بإنشاء ملاحظتك الأولى وستظهر هنا.</p>
      <button class="btn btn-primary" id="emptyBtn">أنشئ ملاحظتك الأولى</button>
    </div>
  </main>
</section>

<!-- محرر الملاحظة -->
<div class="modal-backdrop" id="editorBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editorModalTitle">
    <div class="modal-head">
      <h3 class="modal-title" id="editorModalTitle">ملاحظة جديدة</h3>
      <button class="icon-btn" id="editorClose" aria-label="إغلاق">✕</button>
    </div>
    <input class="editor-title" id="editorTitle" placeholder="عنوان الملاحظة (اختياري)" maxlength="120" autocomplete="off">
    <textarea class="editor-content" id="editorContent" placeholder="اكتب محتوى ملاحظتك هنا..."></textarea>
    <div class="editor-flags">
      <label class="check"><input type="checkbox" id="editorPinned"> 📌 مثبتة</label>
      <label class="check"><input type="checkbox" id="editorArchived"> 🗃 مؤرشفة</label>
    </div>
    <div class="editor-meta">
      <span id="editorCount">0 حرف</span>
      <span id="editorWords">0 كلمة</span>
      <span id="editorDate"></span>
    </div>
    <input type="hidden" id="editorColor" value="default">
    <div class="swatches" id="swatches"></div>
    <div class="modal-actions">
      <button class="btn" id="editorArchive">📦 مؤرشف</button>
      <span class="spacer"></span>
      <button class="btn btn-danger" id="editorDelete" hidden>🗑 حذف</button>
      <button class="btn btn-primary" id="editorSave">✅ حفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
